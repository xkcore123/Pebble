name: Windows Test Build

on:
  push:
    branches:
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend regression tests
        run: pnpm test
      - name: Rust regression tests
        run: cargo test --workspace --all-targets --locked
      - name: Build Windows test package
        run: pnpm build:windows
      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: pebble-windows-test-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/pebble.exe
          if-no-files-found: error
          retention-days: 14
